<style>
  :root {
    --table: #0d2b4e;
    --table-2: #123a68;
    --line: #f4f7fb;
    --ball: #ff7a1a;
    --bg: #eef2f7;
    --surface: #ffffff;
    --ink: #11202f;
    --muted: #5d6b7b;
    --rule: #d9e0e9;
    --win: #1a8f55;
    --loss: #c63b3b;
    --radius: 10px;
    --display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1624;
      --surface: #11233a;
      --ink: #e8eef6;
      --muted: #93a3b6;
      --rule: #223a58;
      --win: #3ecb86;
      --loss: #ff7a7a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.45;
    font-variant-numeric: tabular-nums;
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- Header: the table ---------- */
  header.table {
    background: linear-gradient(180deg, var(--table-2), var(--table));
    color: var(--line);
    padding: 28px 20px 62px;
    position: relative;
  }
  header.table::before {           /* white boundary line of the table */
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(244,247,251,.55);
    border-radius: 6px;
    pointer-events: none;
  }
  header.table::after {            /* centre line */
    content: "";
    position: absolute;
    left: 10px; right: 10px; top: 50%;
    height: 1px;
    background: rgba(244,247,251,.14);
    pointer-events: none;
  }
  .head-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 4rem);
    line-height: .95;
    letter-spacing: .01em;
    margin: 0;
  }
  .paddle { display: inline-block; transform: rotate(-12deg); }
  .ball-track { position: absolute; left: 28px; right: 28px; bottom: 22px; height: 0; z-index: 1; pointer-events: none; }
  .ball-x { position: absolute; bottom: 0; left: 0; animation: travel 5.5s ease-in-out infinite alternate; }

    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe0c2, var(--ball) 55%, #e05f00);
